[versions]
# Пол по aar-metadata целевых артефактов: AGP 8.6.0. Не поднимать до 9.x —
# там убран kotlinOptions и меняется интеграция с Kotlin.
agp = "8.7.3"
# Требование kotlin-stdlib у compose 1.10.6 / material3 1.4.0 / navigation 2.9.8.
kotlin = "2.0.21"
# → compose 1.10.6 + material3 1.4.0 (последний стабильный material3).
compose-bom = "2026.03.01"
hilt = "2.51.1"
hilt-navigation-compose = "1.2.0"
hilt-work = "1.2.0"
navigation-compose = "2.9.8"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinx-serialization = "1.7.1"
kotlinx-serialization-converter = "1.0.0"
room = "2.6.1"
datastore = "1.1.1"
work = "2.9.0"
glide = "4.16.0"
# Не поднимать: 2.9.0+ тянет Glide 5.x (мажор), 2.11.0+ требует kotlin-stdlib 2.4.0.
landscapist-glide = "2.3.2"
# 1.5.1 — последняя, совместимая с compileSdk 35. Нужна ради DownloadManager
# и media3-session: в 1.3.1 загрузчик HLS ещё имел известные проблемы с
# докачкой прерванных сегментов.
media3 = "1.5.1"
coroutines = "1.8.1"
lifecycle = "2.9.4"
# НЕ 1.11+ — требует compileSdk 36.
activity-compose = "1.10.1"
# НЕ 1.17+ — требует compileSdk 36.
core-ktx = "1.16.0"
graphics-shapes = "1.1.0"
# Custom Tabs для OAuth Shikimori: вход в чужой аккаунт нельзя показывать
# в своём WebView — пользователь не может проверить, куда вводит пароль.
browser = "1.8.0"
core-splashscreen = "1.2.0"
junit = "4.13.2"
junit-ext = "1.2.1"
mockk = "1.13.12"
turbine = "1.1.0"
ksp = "2.0.21-1.0.28"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
# Morph-фигуры (RoundedPolygon / Morph) для индикатора нижней навигации.
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphics-shapes" }

# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Lifecycle
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "kotlinx-serialization-converter" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
# MigrationTestHelper: открывает базу старой версии и прогоняет миграцию.
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Images
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
landscapist-glide = { group = "com.github.skydoves", name = "landscapist-glide", version.ref = "landscapist-glide" }
# CrossfadePlugin: без него landscapist показывает картинку рывком.
landscapist-animation = { group = "com.github.skydoves", name = "landscapist-animation", version.ref = "landscapist-glide" }

# Media3 (ExoPlayer)
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Фоновое воспроизведение, уведомление с обложкой, контролы на локскрине.
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# Загрузчик: DownloadManager + SimpleCache живут в media3-exoplayer, но
# DownloadService требует datasource-cronet-независимой реализации из common.
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
# Возобновляет прерванные загрузки после перезагрузки телефона и при
# появлении подходящей сети. WorkManager в проекте уже есть, поэтому берём
# именно его планировщик, а не PlatformScheduler на JobScheduler.
media3-exoplayer-workmanager = { group = "androidx.media3", name = "media3-exoplayer-workmanager", version.ref = "media3" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# Версионируются через compose-bom.
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
